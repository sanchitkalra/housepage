<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>housepage</title>
<meta name="description" content="A tiny personal playground for static sites and PWAs.">
<script>
  // apply a saved choice before first paint; with none saved, the CSS follows the system
  const saved = localStorage.getItem("theme");
  if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #d6d3d1; --btn: #1c1917; --btn-fg: #fafaf9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --btn: #f5f5f4; --btn-fg: #0c0a09;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --btn: #f5f5f4; --btn-fg: #0c0a09;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
    background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 36rem; text-align: center; }
  h1 { font-size: clamp(3rem, 12vw, 6rem); font-weight: 800; letter-spacing: -0.05em; margin: 0 0 1.5rem; }
  p { font-size: 1.15rem; line-height: 1.6; color: var(--muted); margin: 0 0 2.5rem; }
  .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  .actions a {
    padding: 0.75rem 1.5rem; border-radius: 999px; text-decoration: none; font-weight: 600;
    border: 1px solid var(--btn);
  }
  .primary { background: var(--btn); color: var(--btn-fg); }
  .secondary { color: var(--fg); }
  .actions a:hover { opacity: 0.85; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  #theme {
    position: fixed; top: 1rem; right: 1rem; width: 2.5rem; height: 2.5rem; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer;
    display: grid; place-items: center;
  }
  #theme svg { width: 1.2rem; height: 1.2rem; }
  .sun { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sun { display: block; } :root:not([data-theme="light"]) .moon { display: none; } }
  :root[data-theme="dark"] .sun { display: block; }
  :root[data-theme="dark"] .moon { display: none; }
</style>
</head>
<body>
<button id="theme" type="button" aria-label="Switch between light and dark theme">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<main>
  <h1>housepage</h1>
  <p>A tiny personal playground for static sites and PWAs. Every site claims a name and lives at <strong>name.housepage.dev</strong>. Coding agents publish with one CLI command, and pages can keep small shared data of their own.</p>
  <div class="actions">
    <a class="primary" href="https://github.com/sanchitkalra/housepage">GitHub</a>
    <a class="secondary" href="https://github.com/sanchitkalra/housepage#readme">Docs</a>
  </div>
</main>
<script>
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const current = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = current === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    localStorage.setItem("theme", next);
  });
</script>
</body>
</html>
